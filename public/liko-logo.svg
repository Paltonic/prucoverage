<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo "Lengkung Lindung" — VERSI DARK MODE
  Ikon saja, 512 x 512, untuk dipakai di atas latar gelap.
  Warna: Midnight #0E1726 (latar) · Ivory #F4EFE6 · Bright Teal #3CC4B2 · Warm Gold #F2C14E
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Logo Liko — Edukasi Perlindungan (Dark)</title>

  <!-- 0. Latar lingkaran gelap (untuk foto profil Instagram).
       Hapus baris ini jika ingin latar transparan — pastikan
       logo lalu ditempel di atas permukaan gelap. -->
  <circle cx="256" cy="256" r="256" fill="#0E1726"/>

  <!-- 1. Lengkung pelindung (teal terang): payung/atap yang menaungi -->
  <path d="M136 268 A120 120 0 0 1 376 268"
        fill="none" stroke="#3CC4B2" stroke-width="36" stroke-linecap="round"/>

  <!-- 2. Monogram "L" (ivory): tegak = kokoh, kaki = pijakan stabil -->
  <path d="M220 214 V362 H330"
        fill="none" stroke="#F4EFE6" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Titik emas (gold): keluarga/nasabah yang dilindungi -->
  <circle cx="294" cy="306" r="24" fill="#F2C14E"/>
</svg>
